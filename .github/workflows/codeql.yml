name: LibreSpan CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ci/full-librespan-checks]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: librespan-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-java-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source with Spotless baseline
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Install Android SDK 34
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Initialize CodeQL for Java and Kotlin
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # These exact Gradle tasks passed in the normal LibreSpan CI at 92cac3e.
      # A clean runner and disabled Gradle build cache ensure compilation is traced.
      - name: Build Java and Kotlin for CodeQL
        run: bash ./gradlew --no-daemon --stacktrace --no-build-cache testConversationsFreeDebugUnitTest testConversationsFreeReleaseUnitTest

      - name: Analyze Java and Kotlin
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v7

      # The existing default setup also scans GitHub Actions; retain that coverage.
      - name: Initialize CodeQL for GitHub Actions
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Analyze GitHub Actions
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions

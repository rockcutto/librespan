// Top-level build file where you can add configuration options common to all
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "com.diffplug.spotless:spotless-plugin-gradle:6.25.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
    }
}

apply plugin: 'com.android.application'
apply plugin: "com.diffplug.spotless"
apply plugin: 'org.jetbrains.kotlin.android'

repositories {
    google()
    mavenCentral()
    maven { url='https://jitpack.io'}
}

configurations {
    freeImplementation
    conversationsFreeImplementation
}

// Production keeps conscrypt-android. JVM unit tests must not load its Android JNI.
configurations.matching { it.name.endsWith("UnitTestRuntimeClasspath") }.configureEach {
    exclude group: 'org.conscrypt', module: 'conscrypt-android'
}

spotless {
    ratchetFrom 'a7bd7509d8fabcdb1c69570235c097368d219419'
    java {
        target '**/*.java'
        googleJavaFormat().aosp().reflowLongStrings()
    }
}

kotlin {
    jvmToolchain(17) // Указываем использовать Java 17 для всех задач
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    // Local JVM tests need real org.json rather than android.jar stubs.
    testImplementation 'org.json:json:20240303'
    // Robolectric runs on the host JVM; use the host Conscrypt build at runtime.
    testRuntimeOnly 'org.conscrypt:conscrypt-openjdk-uber:2.7.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'

    implementation project(':libs:annotation')
    annotationProcessor project(':libs:annotation-processor')


    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation("com.github.CanHub:Android-Image-Cropper:2.2.0")
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation "androidx.preference:preference:1.2.1"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.13.0-alpha11'
    implementation 'androidx.work:work-runtime:2.9.1'

    implementation "androidx.emoji2:emoji2:1.5.0"
    freeImplementation "androidx.emoji2:emoji2-bundled:1.5.0"
    implementation "androidx.emoji2:emoji2-emojipicker:1.5.0"

    implementation 'org.bouncycastle:bcmail-jdk18on:1.78.1'
    implementation 'com.google.crypto.tink:tink-android:1.23.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.minidns:minidns-client:1.0.4'
    implementation 'org.minidns:minidns-dnssec:1.0.4'
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
    implementation 'org.whispersystems:signal-protocol-java:2.6.2'
    implementation "com.wefika:flowlayout:0.4.1"
    //noinspection GradleDependency
    implementation 'io.deepmedia.community:transcoder-android:0.11.2'

    implementation 'org.jxmpp:jxmpp-jid:1.0.3'
    implementation 'org.jxmpp:jxmpp-stringprep-libidn:1.0.3'
    implementation 'org.osmdroid:osmdroid-android:6.1.11'
    implementation 'org.hsluv:hsluv:0.2'
    // Conscrypt 2.7.0 ships Android native binaries aligned for 16 KB memory pages.
    implementation 'org.conscrypt:conscrypt-android:2.7.0'
    implementation 'me.drakeet.support:toastcompat:1.1.0'
    implementation "com.leinardi.android:speed-dial:3.3.0"

    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'io.michaelrocks:libphonenumber-android:8.13.17'
    implementation 'im.conversations.webrtc:webrtc-android:129.0.0'
    implementation 'org.jitsi:org.otr4j:0.23'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    // https://mvnrepository.com/artifact/info.androidhive/imagefilters
    implementation 'com.github.zomato:androidphotofilters:1.0.2'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    //implementation 'com.splitwise:tokenautocomplete:3.0.2'

    implementation 'com.github.singpolyma:TokenAutoComplete:bfa93780e0'

    implementation 'com.github.kizitonwose.colorpreference:core:1.1.0'
    implementation 'com.github.kizitonwose.colorpreference:support:1.1.0'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.github.singpolyma:Better-Link-Movement-Method:4df081e1e4'
    implementation 'androidx.viewpager:viewpager:1.1.0'

    implementation 'net.zetetic:sqlcipher-android:4.9.0@aar'
    implementation 'androidx.sqlite:sqlite:2.2.0'
    implementation 'com.kizitonwose.calendar:view:2.5.4'
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:3.0-alpha-1'
}

ext {
    preDexEnabled = System.getProperty("pre-dex", "true")
}

android {
    namespace 'eu.siacs.conversations'
    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 23
        versionName "0.9.0"
        archivesBaseName += "LibreSpan-$versionName"
        applicationId "com.librespan"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "applicationId", applicationId
        def appName = "LibreSpan"
        resValue "string", "app_name", appName
        buildConfigField "String", "APP_NAME", "\"$appName\""
        resourceConfigurations += ["en", "ru", "de"]
    }

    configurations {
        implementation.exclude group: 'org.jetbrains' , module:'annotations'
    }

    dataBinding {
        enabled true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    flavorDimensions += "mode"
    flavorDimensions += "distribution"

    productFlavors {
        conversations {
            dimension "mode"
        }

        free {
            dimension "distribution"
            //versionNameSuffix "+free"
        }
    }

    sourceSets {
        conversationsFree {
            java {
                srcDir 'src/conversationsFree/java'
            }
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Install debug builds alongside the production LibreSpan app.
            // Release stays com.librespan, debug becomes com.librespan.debug.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"

            // Some preference intents use @string/applicationId as targetPackage,
            // so it must follow the effective debug application id as well.
            resValue "string", "applicationId", "com.librespan.debug"
            resValue "string", "app_name", "LibreSpan Debug"
            // Keep development builds easy to debug and faster to iterate on.
            shrinkResources false
            minifyEnabled false
        }
    }


    if (new File("signing.properties").exists()) {
        Properties props = new Properties()
        props.load(new FileInputStream(file("signing.properties")))

        signingConfigs {
            release {
                storeFile file(props['keystore'])
                storePassword props['keystore.password']
                keyAlias props['keystore.alias']
                keyPassword props['keystore.password']
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }


    subprojects {

        afterEvaluate {
            if (getPlugins().hasPlugin('android') ||
                    getPlugins().hasPlugin('android-library')) {

                configure(android.lintOptions) {
                    disable 'AndroidGradlePluginVersion', 'MissingTranslation'
                }
            }

        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/BCKEY.DSA', 'META-INF/BCKEY.SF', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    lint {
        disable 'MissingTranslation', 'InvalidPackage', 'AppCompatResource'
    }
    buildFeatures {
        buildConfig true
    }

    android.applicationVariants.configureEach { variant ->
        // LibreSpan ships one universal APK per selected variant. Keep the historical universal
        // version-code range so existing installs can upgrade from earlier split-enabled builds.
        variant.outputs.each { output ->
            output.versionCodeOverride = 100 * project.android.defaultConfig.versionCode
            output.outputFileName = "LibreSpan-${variant.versionName}.apk"
        }
    }
}

tasks.register("assembleLibreSpanDebug") {
    group = "build"
    description = "Assembles the LibreSpan universal debug APK."
    dependsOn("assembleConversationsFreeDebug")
}

tasks.register("assembleLibreSpanRelease") {
    group = "build"
    description = "Assembles the LibreSpan universal release APK."
    dependsOn("assembleConversationsFreeRelease")
}

